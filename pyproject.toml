[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "textureworks"
version = "0.2.0"
description = "GPU-accelerated PBR texture map generation with dual CuPy/PTX implementations"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["textureworks*"]

[tool.setuptools.package-data]
"textureworks.ptx" = ["kernels/*.ptx"]
